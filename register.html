<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Marketpalace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo" aria-label="Marketpalace home">
                <span class="logo-mark" aria-hidden="true"></span>
                <span class="logo-text">Marketpalace</span>
            </a>
            <nav class="header-nav-main" aria-label="Marketplace">
                <a href="shop.html">Shop</a>
                <a href="checkout.html" class="header-cart-link">Cart <span class="badge" data-mp-cart-count>0</span></a>
            </nav>
            <div class="header-actions">
                <span id="auth-links" class="header-auth-slot"></span>
                <a class="btn btn-ghost header-contact-email" href="mailto:hello@marketpalace.com">hello@marketpalace.com</a>
                <a class="btn btn-primary" href="tel:+18005551234">+1 (800) 555-1234</a>
            </div>
        </div>
    </header>

    <main class="page-main">
        <div class="page-hero-mini">
            <div class="container">
                <h1 class="page-title">Create your account</h1>
                <p class="page-lead">Buy digital products—or list your own files as a creator.</p>
            </div>
        </div>
        <div class="container stack-gap">
            <div class="auth-card">
                <form id="register-form" class="form-stack" novalidate>
                    <div id="register-message" class="form-message" data-variant="error" hidden role="alert"></div>
                    <div>
                        <label class="field-label" for="reg-display">Display name</label>
                        <input id="reg-display" name="displayName" type="text" class="input-field" autocomplete="nickname" placeholder="Jane Creator">
                    </div>
                    <div>
                        <label class="field-label" for="reg-email">Email</label>
                        <input id="reg-email" name="email" type="email" class="input-field" autocomplete="email" required>
                    </div>
                    <div>
                        <label class="field-label" for="reg-password">Password</label>
                        <input id="reg-password" name="password" type="password" class="input-field" autocomplete="new-password" required minlength="6">
                        <p class="file-input-note">Minimum 6 characters (demo-only storage).</p>
                    </div>
                    <div>
                        <label class="field-label" for="reg-password2">Confirm password</label>
                        <input id="reg-password2" name="password2" type="password" class="input-field" autocomplete="new-password" required>
                    </div>
                    <label class="checkbox-row">
                        <input id="reg-creator" type="checkbox" name="creator">
                        <span>I plan to sell digital products (<strong>creator</strong>)</span>
                    </label>
                    <button type="submit" class="btn btn-primary full-width-btn">Create account</button>
                </form>
                <p class="form-footer-note">Already have an account? <a href="login.html">Log in</a></p>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p class="footer-brand">© <span id="year"></span> Marketpalace. All rights reserved.</p>
            <div class="footer-links">
                <a href="mailto:hello@marketpalace.com">Email</a>
                <a href="tel:+18005551234">Phone</a>
            </div>
        </div>
    </footer>

    <script src="js/marketpalace.js"></script>
    <script>
        document.getElementById("year").textContent = new Date().getFullYear();

        var form = document.getElementById("register-form");
        var msg = document.getElementById("register-message");

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            msg.hidden = true;

            var displayName = document.getElementById("reg-display").value;
            var email = document.getElementById("reg-email").value.trim();
            var pw = document.getElementById("reg-password").value;
            var pw2 = document.getElementById("reg-password2").value;
            var isCreator = document.getElementById("reg-creator").checked;

            if (pw !== pw2) {
                msg.textContent = "Passwords do not match.";
                msg.setAttribute("data-variant", "error");
                msg.hidden = false;
                return;
            }

            var res = MarketpalaceApp.registerUser(email, pw, displayName, isCreator);
            if (!res.ok) {
                msg.textContent = res.error;
                msg.setAttribute("data-variant", "error");
                msg.hidden = false;
                return;
            }

            var loginTry = MarketpalaceApp.loginUser(email, pw);
            if (!loginTry.ok) {
                msg.textContent = "Registered, but login failed unexpectedly.";
                msg.setAttribute("data-variant", "error");
                msg.hidden = false;
                return;
            }

            MarketpalaceApp.refreshHeaderChrome();
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
